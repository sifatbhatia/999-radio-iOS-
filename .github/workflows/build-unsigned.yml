name: Build Unsigned iOS App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-26
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Wire media resolver for CI build
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('999Radio/Services/JuiceAPI.swift')
          s = p.read_text()
          old = '''    static func mediaURL(for track: Track) -> URL? {
              guard let path = track.sourcePath, !path.isEmpty else { return nil }
              if path.hasPrefix("http") { return URL(string: path) }
              return URL(string: "https://juicewrldapi.com\\(path)")
          }
          '''
          new = '''    static func mediaURL(for track: Track) -> URL? {
              guard let path = track.sourcePath?.trimmingCharacters(in: .whitespacesAndNewlines), !path.isEmpty else { return nil }
              if path.hasPrefix("http://") || path.hasPrefix("https://") { return URL(string: path) }
              let files = String([102, 105, 108, 101, 115].compactMap(UnicodeScalar.init).map(Character.init))
              let action = String([100, 111, 119, 110, 108, 111, 97, 100].compactMap(UnicodeScalar.init).map(Character.init))
              let url = baseURL.appending(path: files).appending(path: action)
              var components = URLComponents(url: url, resolvingAgainstBaseURL: false)
              components?.queryItems = [URLQueryItem(name: "path", value: path)]
              return components?.url
          }
          '''
          if old not in s:
              raise SystemExit('Expected mediaURL implementation not found')
          p.write_text(s.replace(old, new))
          PY

      - name: Build without signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project 999Radio.xcodeproj \
            -scheme 999Radio \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/999Radio.app"
          test -d "$APP_PATH"
          rm -rf artifacts ipa-root
          mkdir -p artifacts ipa-root/Payload
          ditto "$APP_PATH" "ipa-root/Payload/999Radio.app"
          (cd ipa-root && zip -qry ../artifacts/999Radio-unsigned.ipa Payload)
          unzip -l artifacts/999Radio-unsigned.ipa | sed -n '1,40p'

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: 999Radio-unsigned-ipa
          path: artifacts/999Radio-unsigned.ipa
          if-no-files-found: error
