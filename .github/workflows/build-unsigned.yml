name: Build Unsigned iOS App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build unsigned .app
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build without signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project 999Radio.xcodeproj \
            -scheme 999Radio \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Stage unsigned app
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/999Radio.app"
          test -d "$APP_PATH"
          mkdir -p artifacts
          ditto -c -k --keepParent "$APP_PATH" artifacts/999Radio-unsigned.app.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 999Radio-unsigned-app
          path: artifacts/999Radio-unsigned.app.zip
          if-no-files-found: error
