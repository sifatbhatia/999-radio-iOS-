name: Build Unsigned iOS App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-26
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build without signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project 999Radio.xcodeproj \
            -scheme 999Radio \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/999Radio.app"
          test -d "$APP_PATH"
          rm -rf artifacts ipa-root
          mkdir -p artifacts ipa-root/Payload
          ditto "$APP_PATH" "ipa-root/Payload/999Radio.app"
          (cd ipa-root && zip -qry ../artifacts/999Radio-unsigned.ipa Payload)
          unzip -l artifacts/999Radio-unsigned.ipa | sed -n '1,40p'

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: 999Radio-unsigned-ipa
          path: artifacts/999Radio-unsigned.ipa
          if-no-files-found: error
